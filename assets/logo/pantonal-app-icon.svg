<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pantonal">
  <!-- Full-bleed square: platforms round the corners themselves. The mark
       stays inside the central 60%, so circular "maskable" crops keep it. -->
  <rect width="120" height="120" fill="#1c1c1f"/>
  <g transform="translate(60 60) scale(0.6) translate(-61 -62)">
    <rect x="26" y="14" width="18" height="96" rx="9" fill="#f2a35e"/>
    <rect x="50" y="14" width="36" height="16" rx="8" fill="#2fb9d3"/>
    <rect x="72" y="34" width="24" height="16" rx="8" fill="#c98fc4"/>
    <rect x="50" y="54" width="36" height="16" rx="8" fill="#2fb9d3"/>
  </g>
</svg>
