<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pantonal</title>
  <meta name="description" content="Draw music on a 12-note canvas.">
  <meta name="theme-color" content="#1c1c1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pantonal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="vendor/fonts/fredoka-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/Tone.js"></script>
</head>
<body>
  <div id="app">
    <!-- Left rail: what you draw with. -->
    <nav id="toolbar">
      <button class="brand" data-action="about" aria-label="About Pantonal" data-i18n-attr="aria-label:action.about">
        <img src="assets/logo/pantonal-mark.svg" alt="" width="40" height="40">
      </button>
      <button data-tool="brush" class="active drawing-only"><span class="icon" data-icon="brush"></span><span data-i18n="tool.brush">Brush</span></button>
      <button data-tool="erase" class="drawing-only"><span class="icon" data-icon="erase"></span><span data-i18n="tool.erase">Erase</span></button>
      <button data-tool="select" class="chromatic-only"><span class="icon" data-icon="select"></span><span data-i18n="tool.select">Select</span></button>
      <button data-tool="pan" class="chromatic-only"><span class="icon" data-icon="pan"></span><span data-i18n="tool.pan">Pan</span></button>
      <hr class="drawing-only">
      <div id="instruments" class="drawing-only"></div>
    </nav>

    <main>
      <!-- Top bar: what you do with the drawing. -->
      <header id="topbar">
        <button data-action="mode"><span class="icon" data-icon="mode"></span><span data-i18n="action.mode">Mode</span></button>
        <span class="divider drawing-only"></span>
        <button data-action="undo" class="drawing-only"><span class="icon" data-icon="undo"></span><span data-i18n="action.undo">Undo</span></button>
        <button data-action="redo" class="drawing-only"><span class="icon" data-icon="redo"></span><span data-i18n="action.redo">Redo</span></button>
        <button data-action="clear" class="drawing-only"><span class="icon" data-icon="clear"></span><span data-i18n="action.clear">Clear</span></button>
        <span class="divider drawing-only"></span>
        <button data-action="instruments" class="drawing-only"><span class="icon" data-icon="instruments"></span><span data-i18n="action.instruments">Instruments</span></button>
        <button data-action="score" class="chromatic-only"><span class="icon" data-icon="score"></span><span data-i18n="action.score">Score</span></button>
        <button data-action="export" class="chromatic-only"><span class="icon" data-icon="export"></span><span data-i18n="action.export">Export</span></button>
        <button data-action="settings" class="no-free" aria-pressed="false"><span class="icon" data-icon="settings"></span><span data-i18n="action.settings">Settings</span></button>
        <button data-action="scale" class="air-only" aria-expanded="false" aria-controls="scale-menu"><span class="icon" data-icon="scale"></span><span class="label">Free</span></button>
        <button data-action="drone" class="air-only" aria-pressed="false"><span class="icon" data-icon="drone"></span><span data-i18n="action.drone">Drone</span></button>
        <button data-action="rhythm" class="air-only" aria-pressed="false"><span class="icon" data-icon="drum"></span><span data-i18n="action.rhythm">Rhythm</span></button>
        <button data-action="echo" class="air-only" aria-pressed="false"><span class="icon" data-icon="echo"></span><span data-i18n="action.echo">Echo</span></button>
        <button id="play"><span class="icon" data-icon="play"></span><span class="label" data-i18n="action.play">Play</span></button>
      </header>

      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="score-menu" hidden></div>

        <!-- Air Thinker: the scale and key the pitch snaps to. -->
        <div id="scale-menu" hidden>
          <h4 data-i18n="scale.key">Key</h4>
          <div id="key-options" class="keys"></div>
          <p id="scale-hint"></p>
          <p id="drone-hint"></p>
          <div class="scale-extra">
            <button id="scale-hear"><span class="icon" data-icon="play"></span><span data-i18n="scale.hear">Hear it</span></button>
            <p id="scale-fact"></p>
          </div>
          <div id="scale-options"></div>
        </div>

        <!-- Air Thinker: the Echo game. -->
        <div id="echo-panel" hidden>
          <div id="echo-dots"></div>
          <p id="echo-status"></p>
          <div class="echo-buttons">
            <button data-echo="replay" data-i18n="echo.replay">Hear again</button>
            <button data-echo="next" data-i18n="echo.next">New phrase</button>
          </div>
        </div>

        <!-- Air Thinker: how to play, shown until a hand is in view. -->
        <div id="air-guide" hidden>
          <svg class="theremin" viewBox="-34 0 404 280" role="img" aria-label="A theremin" data-i18n-attr="aria-label:guide.alt">
            <!-- field around the pitch antenna -->
            <g fill="none" stroke="#2fb9d3" stroke-width="2.5" stroke-linecap="round">
              <path d="M262 74a16 16 0 0 1 0 30" opacity="0.6"/>
              <path d="M270 66a26 26 0 0 1 0 46" opacity="0.35"/>
            </g>
            <!-- stand -->
            <g stroke="#e9e5dc" stroke-width="3" stroke-linecap="round">
              <path d="M150 206L132 266"/>
              <path d="M220 206L238 266"/>
              <path d="M185 206V266"/>
            </g>
            <!-- cabinet with two knobs -->
            <rect x="100" y="150" width="170" height="56" rx="10" fill="#4a3426" stroke="#e9e5dc" stroke-width="3"/>
            <circle cx="132" cy="178" r="6" fill="#e9e5dc"/>
            <circle cx="156" cy="178" r="6" fill="#e9e5dc"/>
            <!-- pitch antenna (right) and volume loop (left) -->
            <path d="M250 150V42" stroke="#2fb9d3" stroke-width="6" stroke-linecap="round"/>
            <circle cx="250" cy="38" r="6" fill="#2fb9d3"/>
            <path d="M100 170H80" stroke="#f2a35e" stroke-width="6" stroke-linecap="round"/>
            <ellipse cx="56" cy="170" rx="24" ry="11" fill="none" stroke="#f2a35e" stroke-width="6"/>
            <!-- hands -->
            <g fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <g transform="translate(282 62) scale(2.2)">
                <path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/>
              </g>
              <g transform="translate(84 96) scale(-2 2)">
                <path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/>
              </g>
            </g>
            <!-- what each hand does -->
            <g stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M342 70V48M336 54l6-6 6 6M342 116v22M336 132l6 6 6-6" stroke="#2fb9d3"/>
              <path d="M-8 108V88M-14 94l6-6 6 6M-8 136v20M-14 150l6 6 6-6" stroke="#f2a35e"/>
            </g>
            <g font-family="Fredoka, system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle">
              <text x="342" y="38" fill="#2fb9d3" data-i18n="guide.higher">higher</text>
              <text x="342" y="156" fill="#2fb9d3" data-i18n="guide.lower">lower</text>
              <text x="-8" y="78" fill="#f2a35e" data-i18n="guide.louder">louder</text>
              <text x="-8" y="174" fill="#f2a35e" data-i18n="guide.softer">softer</text>
            </g>
          </svg>
          <div class="air-guide-text">
            <h2 data-i18n="guide.title">Play it like a theremin</h2>
            <p class="fact" data-i18n="guide.fact"></p>
            <ul>
              <li><span class="dot pitch"></span><span data-i18n-html="guide.right.html"></span></li>
              <li><span class="dot closed"></span><span data-i18n-html="guide.fist.html"></span></li>
              <li><span class="dot volume"></span><span data-i18n-html="guide.left.html"></span></li>
            </ul>
            <p id="air-guide-status"></p>
          </div>
        </div>
        <div id="select-bar" hidden>
          <button data-select="copy" data-i18n="select.copy">Copy</button>
          <button data-select="paste" data-i18n="select.paste">Paste</button>
          <button data-select="delete" data-i18n="select.delete">Delete</button>
        </div>
      </div>

      <footer id="controls">
        <label><span data-i18n="settings.duration">Time / screen</span> <input type="range" id="duration" min="2" max="60" step="1"><output></output></label>
        <label><span data-i18n="settings.octaves">Octaves / screen</span> <input type="range" id="octaves" min="1" max="9" step="1"><output></output></label>
        <label><span data-i18n="settings.cols">Steps / screen</span> <input type="range" id="cols" min="16" max="256" step="4"><output></output></label>
        <label class="check"><input type="checkbox" id="grid"> <span data-i18n="settings.grid">Grid</span></label>
        <label class="check"><input type="checkbox" id="loop"> <span data-i18n="settings.loop">Loop</span></label>
      </footer>

      <footer id="air-controls">
        <label><span data-i18n="settings.vibratoDepth">Vibrato depth</span> <input type="range" id="vibratoDepth" min="0" max="80" step="1"><output></output></label>
        <label><span data-i18n="settings.vibratoRate">Vibrato speed</span> <input type="range" id="vibratoRate" min="2" max="9" step="0.5"><output></output></label>
        <label><span data-i18n="settings.droneVolume">Drone volume</span> <input type="range" id="droneVolume" min="0" max="100" step="5"><output></output></label>
        <label><span data-i18n="settings.rhythmVolume">Rhythm volume</span> <input type="range" id="rhythmVolume" min="0" max="100" step="5"><output></output></label>
        <label><span data-i18n="settings.rhythmSpeed">Rhythm speed</span> <input type="range" id="rhythmSpeed" min="85" max="115" step="5"><output></output></label>
        <label class="check"><input type="checkbox" id="showTheremin"> <span data-i18n="settings.theremin">Theremin</span></label>
      </footer>
    </main>
  </div>

  <dialog id="mode-dialog">
    <h1 class="lockup">
      <img src="assets/logo/pantonal-mark.svg" alt="" width="64" height="64">
      <span>pantonal</span>
    </h1>
    <p class="subtitle" data-i18n="mode.question">How do you want to think today?</p>
    <button id="mode-continue" hidden>
      <span data-i18n="mode.continue">Continue your last drawing</span>
      <small></small>
    </button>
    <div class="modes">
      <button data-mode="free">
        <span class="icon" data-icon="free"></span>
        <strong data-i18n="mode.free">Free Thinker</strong>
        <span data-i18n="mode.free.desc"></span>
      </button>
      <button data-mode="chromatic">
        <span class="icon" data-icon="piano"></span>
        <strong data-i18n="mode.chromatic">Chromatic Thinker</strong>
        <span data-i18n="mode.chromatic.desc"></span>
      </button>
      <button data-mode="air">
        <span class="icon" data-icon="hand"></span>
        <strong data-i18n="mode.air">Air Thinker</strong>
        <span data-i18n="mode.air.desc"></span>
      </button>
    </div>
    <p id="mode-warning" hidden data-i18n="mode.warning"></p>
    <button id="mode-cancel" hidden data-i18n="mode.cancel">Cancel</button>
    <div class="language-picker" role="group" aria-label="Language" data-i18n-attr="aria-label:language"></div>
    <button id="mode-about" class="link-button" data-action="about" data-i18n="action.about">About Pantonal</button>
  </dialog>

  <dialog id="about-dialog">
    <h2 class="lockup">
      <img src="assets/logo/pantonal-mark.svg" alt="" width="44" height="44">
      <span>pantonal</span>
    </h2>
    <p data-i18n-html="about.intro.html"></p>

    <h3 data-i18n="about.inspiration.title">Inspiration</h3>
    <p data-i18n="about.inspiration"></p>

    <h3 data-i18n="about.credits">Credits</h3>
    <ul>
      <li data-i18n-html="about.piano.html"></li>
      <li data-i18n-html="about.instruments.html"></li>
      <li data-i18n-html="about.tanpura.html"></li>
      <li data-i18n-html="about.rhythm.html"></li>
      <li data-i18n-html="about.engine.html"></li>
      <li data-i18n-html="about.tracking.html"></li>
      <li data-i18n-html="about.font.html"></li>
    </ul>
    <p class="about-license" data-i18n-html="about.license.html"></p>

    <div class="language-picker" role="group" aria-label="Language" data-i18n-attr="aria-label:language"></div>

    <div class="dialog-buttons">
      <button id="about-close" class="primary" data-i18n="about.close">Close</button>
    </div>
  </dialog>

  <dialog id="instruments-dialog">
    <h2 data-i18n="inst.title">Instruments</h2>
    <p id="instruments-note" class="dialog-note"></p>
    <h3 data-i18n="inst.current">In this drawing</h3>
    <div id="session-instruments" class="instrument-grid"></div>
    <h3 data-i18n="inst.add">Add</h3>
    <div id="library-instruments"></div>
    <div class="dialog-buttons">
      <button id="instruments-close" class="primary" data-i18n="inst.done">Done</button>
    </div>
  </dialog>

  <dialog id="import-dialog">
    <h2 id="import-title"></h2>
    <p id="import-error"></p>
    <div id="import-parts"></div>
    <p class="import-note" data-i18n="import.note"></p>
    <div class="dialog-buttons">
      <button id="import-cancel" data-i18n="import.cancel">Cancel</button>
      <button id="import-confirm" class="primary" data-i18n="import.confirm">Import</button>
    </div>
  </dialog>
  <input type="file" id="import-file" accept=".musicxml,.xml,.mxl" hidden>

  <script type="module" src="src/main.js"></script>
</body>
</html>
